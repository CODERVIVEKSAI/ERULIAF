<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form Eruliaf</title>
    <link rel="stylesheet" href="style.css">
    <script src="social-auth.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="form-container">
            <div class="form-blob">
                <img id="random-blob-img" src="books image.jpeg" alt="oops" class="blob-image"
                    style="width: 90%; height: 80%; object-fit: cover; border-radius: 10px; margin-top: 10px; margin-left: 10px;">
            </div>

            <script>
                const images = ['books image.jpeg', 'sports image.jpg', 'instruments image.jpeg', 'football image.jpeg', 'swimming image.jpeg', 'nobel peace price image.jpeg'];
                const randomImg = images[Math.floor(Math.random() * images.length)];
                document.getElementById('random-blob-img').src = randomImg;
            </script>

            <div class="form-header">
                <p>Please enter your details</p>
                <h1>Welcome back</h1>
            </div>

            <form class="form-box" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="email" id="email" class="input-field" placeholder="" required>
                    <label for="email" class="floating-label">email address</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" class="input-field" placeholder="" required>
                    <label for="password" class="floating-label">password</label>
                    <div class="eye-icon" onclick="togglepassword()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-eye preview-icon">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </div>
                </div>

                <div class="input-group checkbox-group">
                    <div class="form-col remember-me">
                        <input type="checkbox" id="remember-me-checkbox" class="checkbox-field">
                        <label for="remember-me-checkbox">Remember me</label>
                    </div>
                    <div class="form-col">
                        <a href="#" class="form-link">Forgot password?</a>
                    </div>
                </div>
                <button type="submit" class="form-btn form-btn--submit"
                    style="padding: 10px; border-radius: 5%; width: 350px; background-color: #007bff; color: white;">Sign
                    in</button>
            </form>

            <div class="form-divider">
                <p>or</p>
            </div>

            <div class="form-button">
                <div class="form socials"
                    style="display: flex; justify-content: center; gap: 12px; margin-bottom: 15px;">
                    <button type="button" class="form-btn form-btn--social" onclick="handleSocialLogin('Google')">
                        <img src="google logo.png" class="btn-icon" alt="Google"
                            style="width: 24px; height: 24px; object-fit: contain;">
                    </button>

                    <button type="button" class="form-btn form-btn--social" onclick="handleSocialLogin('Facebook')">
                        <img src="facebook logo.png" class="btn-icon" alt="Facebook"
                            style="width: 24px; height: 24px; object-fit: contain;">
                    </button>

                    <button type="button" class="form-btn form-btn--social" onclick="handleSocialLogin('Apple')">
                        <img src="apple logo.png" class="btn-icon" alt="Apple"
                            style="width: 24px; height: 24px; object-fit: contain;">
                    </button>
                </div>
                <p id="toggle-text">Don't have an account? <a href="signup.html" class="form-link">Sign up</a></p>
            </div>
        </div>
    </div>

    <script>
        function togglepassword() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.querySelector(".eye-icon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off preview-icon"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
            } else {
                passwordInput.type = "password";
                eyeIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye preview-icon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById("email").value;
            const passwordInput = document.getElementById("password").value;

            const savedEmail = localStorage.getItem("userEmail");
            const savedPassword = localStorage.getItem("userPassword");

            if (emailInput === savedEmail && passwordInput === savedPassword) {
                window.location.href = "dashboard.html";
            } else if (!savedEmail) {
                window.location.href = "dashboard.html";
            } else {

                console.error("Incorrect credentials.");
            }
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
